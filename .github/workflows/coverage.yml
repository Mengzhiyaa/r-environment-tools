name: Coverage

on:
  pull_request:
    branches: [main, "release*", "release/*", "release-*"]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: coverage-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: coverage-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate snapshot comparator
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
        shell: bash

      - name: Post coverage started comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ matrix.comment_header }}
          message: |
            ## Coverage Report (${{ matrix.platform }})

            Comparing with exact base `${{ github.event.pull_request.base.sha }}`.

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Add Conda to PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Add Conda to PATH (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "PATH=$PATH:$CONDA/condabin" >> $GITHUB_ENV
        shell: bash

      - name: Create Conda R environment
        run: conda create -n r-conda-env r-base -c conda-forge -y

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --features ci --lcov --output-path lcov.info -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
        shell: bash

      - name: Upload PR coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ matrix.os }}
          path: lcov.info
          if-no-files-found: ignore

      - name: Wait for exact-base coverage
        if: always()
        run: >-
          python scripts/wait_for_baseline.py
          --repository "${{ github.repository }}"
          --workflow coverage-baseline.yml
          --commit "${{ github.event.pull_request.base.sha }}"
          --artifact "coverage-baseline-${{ matrix.os }}"
          --timeout-seconds 1200
          --poll-seconds 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

      - name: Download exact-base coverage
        if: always()
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: coverage-baseline.yml
          commit: ${{ github.event.pull_request.base.sha }}
          workflow_conclusion: success
          name: coverage-baseline-${{ matrix.os }}
          path: baseline-coverage
          check_artifacts: true
          search_artifacts: true

      - name: Compare coverage snapshot
        if: always()
        run: >-
          python scripts/quality_snapshot.py coverage
          --current lcov.info
          --baseline baseline-coverage/lcov.info
          --platform "${{ matrix.platform }}"
          --report coverage-report.md
          --summary "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Post coverage report
        if: always() && hashFiles('coverage-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ matrix.comment_header }}
          path: coverage-report.md
