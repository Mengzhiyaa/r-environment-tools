name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          # Linux and macOS targets → tar.gz
          for label in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            dir="artifacts/ret-release-${label}-archive"
            if [ -d "$dir" ]; then
              chmod +x "${dir}/ret"
              tar -czf "release/ret-${VERSION}-${label}.tar.gz" \
                -C "$dir" ret
            fi
          done

          # Windows targets → tar.gz
          for label in windows-x64 windows-arm64; do
            dir="artifacts/ret-release-${label}-archive"
            if [ -d "$dir" ]; then
              tar -czf "release/ret-${VERSION}-${label}.tar.gz" \
                -C "$dir" ret.exe
            fi
          done

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > checksums.sha256
          echo "=== Checksums ==="
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
