name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          # Linux and macOS targets → tar.gz
          for spec in linux-x64:x86_64-unknown-linux-musl darwin-x64:x86_64-apple-darwin darwin-arm64:aarch64-apple-darwin; do
            label="${spec%%:*}"
            dir="artifacts/ret-release-${label}-archive"
            if [ -d "$dir" ]; then
              chmod +x "${dir}/ret"
              tar -czf "release/ret-${VERSION}-${label}.tar.gz" \
                -C "$dir" ret
            fi
          done

          # Windows targets → zip
          for spec in windows-x64:x86_64-pc-windows-msvc windows-arm64:aarch64-pc-windows-msvc; do
            label="${spec%%:*}"
            dir="artifacts/ret-release-${label}-archive"
            if [ -d "$dir" ]; then
              (cd "$dir" && zip -r "../../release/ret-${VERSION}-${label}.zip" ret.exe)
            fi
          done

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > checksums.sha256
          echo "=== Checksums ==="
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
