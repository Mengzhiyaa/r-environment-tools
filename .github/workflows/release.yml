name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml

  lint:
    uses: ./.github/workflows/lint.yml

  release:
    name: Create Release
    needs: [checks, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ret-release-*-archive

      - name: Package Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          # Linux and macOS targets → tar.gz
          for label in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            dir="artifacts/ret-release-${label}-archive"
            chmod +x "${dir}/ret"
            tar -czf "release/ret-${VERSION}-${label}.tar.gz" \
              -C "$dir" ret
          done

          # Windows targets → tar.gz
          for label in windows-x64 windows-arm64; do
            dir="artifacts/ret-release-${label}-archive"
            tar -czf "release/ret-${VERSION}-${label}.tar.gz" \
              -C "$dir" ret.exe
          done

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > checksums.sha256
          echo "=== Checksums ==="
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
