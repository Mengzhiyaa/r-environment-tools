name: PR/CI Check

on:
  pull_request:
    branches:
      - main
      - release*
      - release/*
      - release-*
  push:
    branches:
      - main
      - release*
      - release/*
      - release-*
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: Integration tests with real R environments
  #
  # Installs R via multiple package managers on each platform, then
  # runs the CI test suite to validate that each locator correctly
  # discovers the installations it is responsible for.
  # ──────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            run_cli: "yes"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_cli: "yes"
          - os: macos-latest
            target: aarch64-apple-darwin
            run_cli: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install System R ──
      # On Linux this installs to /usr/bin/R (LinuxGlobalR locator).
      # On macOS this installs to /Library/Frameworks/R.framework (MacFramework locator).
      # On Windows this installs to C:\Program Files\R (WindowsRegistry locator).
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Verify R installation
        run: |
          R --version
          which R || where R
        shell: bash

      # ── Homebrew (Linux and macOS) ──
      # Ubuntu includes Linuxbrew, but does not add it to PATH.
      - name: Add Homebrew to PATH (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"
          echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> "$GITHUB_ENV"
          echo "HOMEBREW_CELLAR=$HOMEBREW_CELLAR" >> "$GITHUB_ENV"
        shell: bash

      - name: Homebrew R
        if: runner.os != 'Windows'
        run: brew install r
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash

      # ── Conda (all platforms) ──
      - name: Add Conda to PATH
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Add Conda to PATH
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "PATH=$PATH:$CONDA/condabin" >> $GITHUB_ENV
        shell: bash

      - name: Install Conda + add to PATH
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -o ~/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
          bash ~/miniconda.sh -b -p ~/miniconda
          echo "PATH=$PATH:$HOME/miniconda/bin" >> $GITHUB_ENV
          echo "CONDA=$HOME/miniconda" >> $GITHUB_ENV
        shell: bash

      - name: Check Conda version
        run: conda info --all

      - name: Create Conda R environment
        run: conda create -n r-conda-env r-base -c conda-forge -y

      # ── Pixi (all platforms) ──
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Create Pixi R environment
        run: |
          pixi init pixi-r-project
          cd pixi-r-project
          pixi project channel add conda-forge
          pixi add r-base
          pixi install
        shell: bash

      # ── Chocolatey (Windows only) ──
      # Chocolatey is pre-installed on GitHub Windows runners.
      # This tests the Chocolatey locator against a real choco-installed R.
      - name: Chocolatey R
        if: startsWith(matrix.os, 'windows')
        run: choco install r.project --no-progress -y
        shell: bash

      - name: Install musl tools
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ── Rust ──
      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo Fetch
        run: cargo fetch --locked
        shell: bash

      - name: Find R Environments
        if: matrix.run_cli == 'yes'
        run: cargo run --release --target ${{ matrix.target }} -- find -v -l
        shell: bash

      - name: Run Tests
        run: cargo test --frozen --target ${{ matrix.target }} --features ci -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
        shell: bash

      - name: Verify Homebrew R discovery
        if: runner.os != 'Windows'
        run: cargo test --frozen --target ${{ matrix.target }} --features ci --test ci_test check_if_homebrew_r_exists -- --ignored --nocapture
        shell: bash

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Cross-platform builds
  # ──────────────────────────────────────────────────────────────────
  builds:
    uses: ./.github/workflows/build.yml
