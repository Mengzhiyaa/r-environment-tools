name: PR/CI Check

on:
  pull_request:
    branches:
      - main
      - release*
      - release/*
      - release-*
  push:
    branches:
      - main
      - release*
      - release/*
      - release-*
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: Integration tests with real R environments
  #
  # Installs R via multiple package managers on each platform, then
  # runs the CI test suite to validate that each locator correctly
  # discovers the installations it is responsible for.
  # ──────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            run_cli: "yes"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_cli: "yes"
          - os: macos-latest
            target: x86_64-apple-darwin
            run_cli: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install System R ──
      # On Linux this installs to /usr/bin/R (LinuxGlobalR locator).
      # On macOS this installs to /Library/Frameworks/R.framework (MacFramework locator).
      # On Windows this installs to C:\Program Files\R (WindowsRegistry locator).
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Verify R installation
        run: |
          R --version
          which R || where R
        shell: bash

      # ── Homebrew (macOS only) ──
      # Homebrew is the native package manager on macOS.
      # This tests the Homebrew locator against a real brew-installed R.
      - name: Homebrew R
        if: startsWith(matrix.os, 'macos')
        run: brew install r
        shell: bash

      # ── Conda (all platforms) ──
      - name: Add Conda to PATH
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Add Conda to PATH
        if: startsWith(matrix.os, 'ubuntu')
        run: echo "PATH=$PATH:$CONDA/condabin" >> $GITHUB_ENV
        shell: bash

      - name: Install Conda + add to PATH
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -o ~/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
          bash ~/miniconda.sh -b -p ~/miniconda
          echo "PATH=$PATH:$HOME/miniconda/bin" >> $GITHUB_ENV
          echo "CONDA=$HOME/miniconda" >> $GITHUB_ENV
        shell: bash

      - name: Check Conda version
        run: conda info --all

      - name: Create Conda R environment
        run: conda create -n r-conda-env r-base -c conda-forge -y

      # ── Pixi (all platforms) ──
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Create Pixi R environment
        run: |
          pixi init pixi-r-project
          cd pixi-r-project
          pixi project channel add conda-forge
          pixi add r-base
          pixi install
        shell: bash

      # ── Chocolatey (Windows only) ──
      # Chocolatey is pre-installed on GitHub Windows runners.
      # This tests the Chocolatey locator against a real choco-installed R.
      - name: Chocolatey R
        if: startsWith(matrix.os, 'windows')
        run: choco install r.project --no-progress -y
        shell: bash

      # ── Rust ──
      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo Fetch
        run: cargo fetch
        shell: bash

      - name: Find R Environments
        if: matrix.run_cli == 'yes'
        run: cargo run --release --target ${{ matrix.target }} -- find -v -l
        shell: bash

      - name: Run Tests
        run: cargo test --frozen --features ci -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
        shell: bash

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Container tests
  #
  # Homebrew on Ubuntu requires a container (homebrew/brew image)
  # because Linuxbrew is not trivially installable on standard
  # runners. This mirrors PET's ci-homebrew-container approach.
  # ──────────────────────────────────────────────────────────────────
  container-tests:
    name: Tests in Containers
    container:
      image: ${{ matrix.image }}
      options: --user=root
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: ci-homebrew-container
            os: ubuntu-latest
            image: homebrew/brew
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Homebrew R (Linuxbrew)
      - name: Homebrew R
        if: startsWith(matrix.image, 'homebrew')
        run: |
          brew update || true
          brew install r
        shell: bash

      - name: Verify R installation
        run: |
          R --version
          which R
        shell: bash

      # Rust
      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo Fetch
        run: cargo fetch
        shell: bash

      - name: Find R Environments
        run: cargo run --release --target ${{ matrix.target }} -- find -v -l
        shell: bash

      - name: Run Tests
        run: cargo test --frozen --features ${{ matrix.feature }} -- --nocapture
        shell: bash

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Cross-platform builds
  # ──────────────────────────────────────────────────────────────────
  builds:
    name: Build (${{ matrix.arch }}-${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x64
            run_cli: "yes"
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            run_cli: "yes"
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            run_cli: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo Fetch
        run: cargo fetch
        shell: bash

      - name: Run Tests
        run: cargo test --frozen
        shell: bash

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ret-release-${{ matrix.platform }}-${{ matrix.arch }}-archive
          path: target/${{ matrix.target }}/release/ret*
